name: Build & Release EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Auto Versioning Tag
        id: version
        shell: pwsh
        run: |
          $VERSION = "v1.0.$($env:GITHUB_RUN_NUMBER)"
          echo "tag=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Build Newv1 EXE with PyInstaller
        run: |
          python -m PyInstaller --noconsole --onefile --icon="icon.ico" --name "pramaxx-remote-server" --add-binary "cloudflared.exe;." --version-file "version_info.txt" newv1.py


      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Pramaxx Remote ${{ steps.version.outputs.tag }}"
          body: |
            ### Pramaxx Remote Server & Exe (${{ steps.version.outputs.tag }})
            - **EXE Files**: Auto-generated dari GitHub Actions (Windows Environment dengan semua dependensi lengkap).
          files: |
            dist/pramaxx-remote-server.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}